services:
  ave-and-john:
    build: .
    container_name: ave-and-john
    restart: unless-stopped
    ports:
      - "3060:3060"
    volumes:
      - ./data:/app/data
    environment:
      - NAME_A=Person A
      - NAME_B=Person B
      - START_DATE=2025-01-01
      - VAPID_EMAIL=your-email@example.com
